<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronostrophe</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 0%, #16102c 0%, #05030a 70%);
        color: #cfd8ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #d6b3ff;
        text-shadow: 0 0 18px rgba(141, 92, 246, 0.65);
      }
      #app {
        width: min(95vw, 1200px);
        height: min(calc(100vh - 130px), 800px);
      }
      #app canvas {
        image-rendering: pixelated;
        border: 1px solid #2b2050;
        box-shadow: 0 0 60px rgba(109, 75, 214, 0.35);
      }
      p {
        margin: 0;
        font-size: 12px;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <h1>Chronostrophe dev1.2</h1>
      <div id="app"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
